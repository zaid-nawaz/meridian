[project]
name = "meridian"
version = "0.1.0"
description = "Meridian Breakdown-to-Resolution System"
requires-python = ">=3.12"
dependencies = [
    "langchain",
    "langgraph",
    "langchain-community",
    "pandas",
    "openpyxl",
    "pydantic",
    "pytest",
    "fastapi",
    "uvicorn",
    "langchain-text-splitters>=1.1.2",
    "chromadb>=1.5.9",
    "sentence-transformers>=6.0.0",
    "langchain-openai>=1.6.0",
]

[tool.pytest.ini_options]
pythonpath = [
    "."
]
